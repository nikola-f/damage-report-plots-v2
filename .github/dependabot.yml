version: 2

updates:
  - package-ecosystem: "bundler"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown-days: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown-days: 5

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown-days: 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/dev"
    schedule:
      interval: "weekly"
    cooldown-days: 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/prod"
    schedule:
      interval: "weekly"
    cooldown-days: 5

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/management"
    schedule:
      interval: "weekly"
    cooldown-days: 5
