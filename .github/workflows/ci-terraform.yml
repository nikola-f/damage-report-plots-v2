name: Terraform CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/ci-terraform.yml'
  push:
    branches: [develop, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/ci-terraform.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  fmt-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: fmt-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            gcp_project_id: damage-report-plots-dev
          - environment: prod
            gcp_project_id: damage-report-plots-prod

    environment: ${{ matrix.environment }}

    env:
      TF_VAR_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
      TF_VAR_aws_assume_role_arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_api_domain_name: ${{ secrets.API_DOMAIN_NAME }}
      TF_VAR_api_allowed_origins: ${{ secrets.API_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;
            const status = '${{ steps.plan.outcome }}';
            const icon = status === 'success' ? '✅' : '❌';
            const body = `### Terraform Plan \`${{ matrix.environment }}\` ${icon}
            <details><summary>Show Plan</summary>

            \`\`\`
            ${truncated}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: fmt-check
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_VAR_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
      TF_VAR_aws_assume_role_arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_api_domain_name: ${{ secrets.API_DOMAIN_NAME }}
      TF_VAR_api_allowed_origins: ${{ secrets.API_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

  apply-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt-check
    runs-on: ubuntu-latest
    environment: prod

    env:
      TF_VAR_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
      TF_VAR_aws_assume_role_arn: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_api_domain_name: ${{ secrets.API_DOMAIN_NAME }}
      TF_VAR_api_allowed_origins: ${{ secrets.API_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@a89a83ec143615402a01f672b6e172b7b1875000  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve
