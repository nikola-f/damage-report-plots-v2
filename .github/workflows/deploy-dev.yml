name: Deploy Dev ECS Services

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options: [all, web, worker]
      image_tag:
        description: 'Docker image tag to deploy (leave empty to update service config only)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # Resolve which services to deploy into a matrix so `all` runs web and worker
  # as parallel jobs (the ECS rollout wait dominates runtime; running them
  # sequentially in one job roughly doubled it).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            echo 'matrix={"service":["web","worker"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"service":["${{ inputs.service }}"]}' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      APP_NAME: drp
      ENV: dev
      ECSPRESSO_VERSION: 2.8.3

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Deploy ${{ matrix.service }}
        working-directory: ecspresso/${{ matrix.service }}
        run: |
          # The worker has no load balancer, so a config-only change leaves the
          # running task untouched; force a new deployment to roll it.
          FORCE=""
          [ "${{ matrix.service }}" = "worker" ] && FORCE="--force-new-deployment"
          if [ -n "${{ inputs.image_tag }}" ]; then
            ecspresso deploy --ext-str APP_NAME=$APP_NAME --ext-str ENV=$ENV --ext-str IMAGE_TAG=${{ inputs.image_tag }} $FORCE
          else
            ecspresso deploy --ext-str APP_NAME=$APP_NAME --ext-str ENV=$ENV --skip-task-definition $FORCE
          fi
