name: API CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9  # v1.316.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Run RSpec
        env:
          RAILS_ENV: test
        # e2e specs are excluded by default (RUN_E2E unset); they run in the
        # dedicated `e2e` job below. See spec/spec_helper.rb.
        run: bundle exec rspec

  brakeman:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9  # v1.316.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

  e2e:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
      valkey:
        image: valkey/valkey
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9  # v1.316.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Create SQS queues
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-report-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-reports-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false

      - name: Run e2e specs
        env:
          RAILS_ENV: test
          RUN_E2E: "true"
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_TEST_SPREADSHEET_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          SETTINGS__SQS_THREAD_IDS_QUEUE_URL: http://localhost:4566/000000000000/test-report-queue.fifo
          SETTINGS__SQS_REPORTS_QUEUE_URL: http://localhost:4566/000000000000/test-reports-queue.fifo
          SETTINGS__REDIS_URL: redis://localhost:6380/0
        run: bundle exec rspec spec/e2e

