name: API CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'ecspresso/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735  # v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true
          working-directory: apps/api

      - name: Run RSpec
        env:
          RAILS_ENV: test
        run: bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb"

  build-push-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/drp-api:$IMAGE_TAG \
            -t $ECR_REGISTRY/drp-api:latest \
            ./apps/api
          docker push $ECR_REGISTRY/drp-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/drp-api:latest

  build-push-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/drp-api:$IMAGE_TAG \
            -t $ECR_REGISTRY/drp-api:latest \
            ./apps/api
          docker push $ECR_REGISTRY/drp-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/drp-api:latest

  deploy-dev:
    needs: build-push-dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          curl -sL https://github.com/kayac/ecspresso/releases/download/v2.4.4/ecspresso_v2.4.4_linux_amd64.tar.gz \
            -o /tmp/ecspresso.tar.gz
          tar xz -C /tmp -f /tmp/ecspresso.tar.gz ecspresso
          sudo mv /tmp/ecspresso /usr/local/bin/ecspresso

      - name: Deploy web
        env:
          APP_NAME: drp
          ENV: dev
        run: |
          ecspresso deploy \
            --config ecspresso/web/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=dev \
            --ext-str IMAGE_TAG=${{ github.sha }}

      - name: Deploy worker
        env:
          APP_NAME: drp
          ENV: dev
        run: |
          ecspresso deploy \
            --config ecspresso/worker/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=dev \
            --ext-str IMAGE_TAG=${{ github.sha }}

  deploy-prod:
    needs: build-push-prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          curl -sL https://github.com/kayac/ecspresso/releases/download/v2.4.4/ecspresso_v2.4.4_linux_amd64.tar.gz \
            -o /tmp/ecspresso.tar.gz
          tar xz -C /tmp -f /tmp/ecspresso.tar.gz ecspresso
          sudo mv /tmp/ecspresso /usr/local/bin/ecspresso

      - name: Deploy web
        env:
          APP_NAME: drp
          ENV: prod
        run: |
          ecspresso deploy \
            --config ecspresso/web/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=prod \
            --ext-str IMAGE_TAG=${{ github.sha }}

      - name: Deploy worker
        env:
          APP_NAME: drp
          ENV: prod
        run: |
          ecspresso deploy \
            --config ecspresso/worker/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=prod \
            --ext-str IMAGE_TAG=${{ github.sha }}
