name: API CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'ecspresso/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1.314.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Run RSpec
        env:
          RAILS_ENV: test
        # e2e specs are excluded by default (RUN_E2E unset); they run in the
        # dedicated `e2e` job below. See spec/spec_helper.rb.
        run: bundle exec rspec

  brakeman:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1.314.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

  e2e:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
      valkey:
        image: valkey/valkey
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1.314.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: apps/api

      - name: Create SQS queues
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-report-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-reports-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false

      - name: Run e2e specs
        env:
          RAILS_ENV: test
          RUN_E2E: "true"
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_TEST_SPREADSHEET_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          SETTINGS__SQS_THREAD_IDS_QUEUE_URL: http://localhost:4566/000000000000/test-report-queue.fifo
          SETTINGS__SQS_REPORTS_QUEUE_URL: http://localhost:4566/000000000000/test-reports-queue.fifo
          SETTINGS__REDIS_URL: redis://localhost:6380/0
        run: bundle exec rspec spec/e2e

  build-push-dev:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04-arm
    environment: dev

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --pull \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t $ECR_REGISTRY/drp-api:$IMAGE_TAG --push ./apps/api

  build-push-prod:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: prod

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --pull \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t $ECR_REGISTRY/drp-api:$IMAGE_TAG --push ./apps/api

  # web と worker は独立サービス（順序依存なし）なので matrix で並列デプロイする。
  deploy-dev:
    needs: build-push-dev
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        service: [web, worker]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          ECSPRESSO_VERSION=2.8.3
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Deploy ${{ matrix.service }}
        # ecspresso.yml resolves cluster/service via must_env, so APP_NAME and
        # ENV must be present as OS env vars (--ext-str only feeds jsonnet).
        env:
          APP_NAME: drp
          ENV: dev
        run: |
          ecspresso deploy \
            --config ecspresso/${{ matrix.service }}/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=dev \
            --ext-str IMAGE_TAG=${{ github.sha }}

  # web と worker は独立サービス（順序依存なし）なので matrix で並列デプロイする。
  deploy-prod:
    needs: build-push-prod
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        service: [web, worker]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          ECSPRESSO_VERSION=2.8.3
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Deploy ${{ matrix.service }}
        # ecspresso.yml resolves cluster/service via must_env, so APP_NAME and
        # ENV must be present as OS env vars (--ext-str only feeds jsonnet).
        env:
          APP_NAME: drp
          ENV: prod
        run: |
          ecspresso deploy \
            --config ecspresso/${{ matrix.service }}/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=prod \
            --ext-str IMAGE_TAG=${{ github.sha }}
