name: API CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'ecspresso/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6  # v1.308.0
        with:
          ruby-version: '4.0.4'
          bundler-cache: true
          working-directory: apps/api

      - name: Run RSpec
        env:
          RAILS_ENV: test
        run: bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb"

  brakeman:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6  # v1.308.0
        with:
          ruby-version: '4.0.4'
          bundler-cache: true
          working-directory: apps/api

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

  e2e:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
      valkey:
        image: valkey/valkey
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6  # v1.308.0
        with:
          ruby-version: '4.0.4'
          bundler-cache: true
          working-directory: apps/api

      - name: Create SQS queues
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-report-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false
          aws --endpoint-url=http://localhost:4566 --region us-east-1 sqs create-queue \
            --queue-name test-reports-queue.fifo \
            --attributes FifoQueue=true,ContentBasedDeduplication=false

      - name: Run e2e specs
        env:
          RAILS_ENV: test
          GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TEST_SPREADSHEET_ID: ${{ secrets.GOOGLE_TEST_SPREADSHEET_ID }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          SETTINGS__SQS_THREAD_IDS_QUEUE_URL: http://localhost:4566/000000000000/test-report-queue.fifo
          SETTINGS__SQS_REPORTS_QUEUE_URL: http://localhost:4566/000000000000/test-reports-queue.fifo
          SETTINGS__REDIS_URL: redis://localhost:6380/0
        run: bundle exec rspec spec/e2e

  build-push-dev:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04-arm
    environment: dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --pull \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t $ECR_REGISTRY/drp-api:$IMAGE_TAG --push ./apps/api

  build-push-prod:
    needs: [test, brakeman]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: prod

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419  # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --pull \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t $ECR_REGISTRY/drp-api:$IMAGE_TAG --push ./apps/api

  deploy-dev:
    needs: build-push-dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (dev role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          ECSPRESSO_VERSION=2.8.3
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Deploy web
        env:
          APP_NAME: drp
          ENV: dev
        run: |
          ecspresso deploy \
            --config ecspresso/web/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=dev \
            --ext-str IMAGE_TAG=${{ github.sha }}

      - name: Deploy worker
        env:
          APP_NAME: drp
          ENV: dev
        run: |
          ecspresso deploy \
            --config ecspresso/worker/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=dev \
            --ext-str IMAGE_TAG=${{ github.sha }}

  deploy-prod:
    needs: build-push-prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (prod role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          ECSPRESSO_VERSION=2.8.3
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Deploy web
        env:
          APP_NAME: drp
          ENV: prod
        run: |
          ecspresso deploy \
            --config ecspresso/web/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=prod \
            --ext-str IMAGE_TAG=${{ github.sha }}

      - name: Deploy worker
        env:
          APP_NAME: drp
          ENV: prod
        run: |
          ecspresso deploy \
            --config ecspresso/worker/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=prod \
            --ext-str IMAGE_TAG=${{ github.sha }}
