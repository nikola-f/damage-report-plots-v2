name: Decommission ECS

# One-shot, manually triggered helper for Phase 3, Stage 2: delete the
# ecspresso-managed ECS services (web/worker) so the Terraform ECS cluster can
# then be destroyed. Services must be deleted here because they are managed by
# ecspresso, not Terraform. Uses the same OIDC → management → env-role chain as
# the deploy jobs so it can read the management-account tfstate. Removed once the
# decommission is complete.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: [web, worker]

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (management OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Configure AWS credentials (env role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2
          role-chaining: true

      - name: Install ecspresso
        run: |
          ECSPRESSO_VERSION=2.8.3
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/ecspresso_${ECSPRESSO_VERSION}_linux_amd64.tar.gz" -o /tmp/ecspresso.tar.gz
          curl -fsSL "https://github.com/kayac/ecspresso/releases/download/v${ECSPRESSO_VERSION}/checksums.txt" -o /tmp/ecspresso_checksums.txt
          EXPECTED=$(grep "linux_amd64.tar.gz" /tmp/ecspresso_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/ecspresso.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch"; exit 1; }
          tar xz -C /usr/local/bin -f /tmp/ecspresso.tar.gz ecspresso
          ecspresso version

      - name: Delete ${{ matrix.service }} service
        # ecspresso.yml resolves cluster/service via must_env, so APP_NAME and
        # ENV must be OS env vars. --force skips the interactive confirmation;
        # --terminate stops any lingering tasks (services are already at
        # desiredCount 0). IMAGE_TAG is unused for delete but keeps jsonnet happy.
        env:
          APP_NAME: drp
          ENV: ${{ inputs.environment }}
        run: |
          ecspresso delete --force --terminate \
            --config ecspresso/${{ matrix.service }}/ecspresso.yml \
            --ext-str APP_NAME=drp \
            --ext-str ENV=${{ inputs.environment }} \
            --ext-str IMAGE_TAG=unused
