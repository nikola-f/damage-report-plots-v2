region: us-west-2
cluster: "{{ must_env `APP_NAME` }}-{{ must_env `ENV` }}"
service: "{{ must_env `APP_NAME` }}-{{ must_env `ENV` }}-web"
service_definition: ecs-service-def.jsonnet
task_definition: ecs-task-def.jsonnet
timeout: 10m

plugins:
  - name: tfstate
    config:
      url: "s3://drp-tfstate/{{ must_env `ENV` }}/terraform.tfstate"
